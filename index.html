<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@keaoa 🍅</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- надпись в левом верхнем углу -->
<div class="brand" aria-label="@keaoa">
  <span class="brand-ico">🍅</span>
  <span class="brand-txt">@keaoa<i class="brand-line"></i></span>
</div>

<!-- счётчик попаданий -->
<div class="counter" id="counter">🍅 попаданий: <b>0</b></div>

<main class="wrap">
  <div class="frame-float">
    <div class="frame" id="frame">
      <img src="photo.jpg" alt="@keaoa" draggable="false">
      <div class="splat-layer" id="splatLayer"></div>
      <div class="frame-sheen"></div>
    </div>
  </div>
  <div class="hint">🍅 <b>Кликни по фото</b> — и попадёшь помидором</div>
</main>

<!-- слой летящих помидоров -->
<div class="fly-layer" id="flyLayer" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
